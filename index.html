<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指尖上的戀愛密碼</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcf6f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #b08968;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .result {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #faf3ee;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ 指尖上的戀愛密碼 ✨</h2>
    <p style="font-size: 14px; color: #666;">量一量左手無名指周長，測出你的戀愛人格！</p>
    
    <div id="quiz-box">
        <select id="ring-size">
            <option value="" disabled selected>請選擇你的指圍公分...</option>
            <option value="1">4.5 cm - 4.9 cm (精緻小巧型)</option>
            <option value="2">5.0 cm - 5.4 cm (溫柔平衡型)</option>
            <option value="3">5.5 cm - 5.9 cm (大器率性型)</option>
            <option value="4">6.0 cm 以上 (福氣富貴型)</option>
        </select>
        <button onclick="getResult()">查看結果 🔮</button>
    </div>

    <div id="result-box" class="result">
        <h3 id="res-title" style="color: #9c7553; margin-top:0;"></h3>
        <p id="res-desc" style="font-size: 14px; line-height: 1.5;"></p>
        <button onclick="location.reload()" style="background-color: #d4a373; margin-top: 15px;">重新測驗</button>
    </div>
</div>

<script>
    function getResult() {
        var select = document.getElementById("ring-size");
        var val = select.value;
        
        if (!val) {
            alert("請先選擇指圍範圍喔！");
            return;
        }

        var data = {
            "1": { title: "【4.5 - 4.9 cm】精緻小巧型 (貓系)", desc: "獨立、聰明，對生活非常有品味。在感情裡慢熟但認定了就會全心投入！" },
            "2": { title: "【5.0 - 5.4 cm】溫柔平衡型 (犬系)", desc: "善解人意、超高同理心。對另一半超級貼心，是把生活打理得溫馨的小太陽！" },
            "3": { title: "【5.5 - 5.9 cm】大器率性型 (女王)", desc: "很有主見、執行力強，私底下有反差萌的小女人特質，魅力十足！" },
            "4": { title: "【6.0 cm 以上】福氣富貴型 (聚寶盆)", desc: "天生帶有領導者氣場，金錢與貴人運極旺，熱愛質感生活的幸運兒！" }
        };

        document.getElementById("res-title").innerText = data[val].title;
        document.getElementById("res-desc").innerText = data[val].desc;
        
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("result-box").style.display = "block";
    }
</script>

</body>
</html>
